<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Inventory</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <!--
          左上角原来有一个品牌块：一个紫蓝渐变的方块 + 应用名 + 版本号。
          三样都去掉了。
          方块只是个装饰，却占着顶栏最左边、最容易被看到的位置；
          应用名和版本号从窗口标题栏就能看到。
          顶栏这一行现在只放工作区与导航。
        -->
        <div class="ws-picker" id="ws-picker"></div>
        <nav id="tabs">
          <button data-tab="dashboard" class="tab active">概览</button>
          <button data-tab="groups" class="tab">分组</button>
          <button data-tab="items" class="tab">明细</button>
          <!--
            「时间轴」页取消了。

            它回答的是"同一段时间里有多少东西要到期"，但那个问题
            横幅已经报了数、分组页也按分类列出了到期时间与剩余天数 ——
            为它单开一页（一条横向时间轴 + 28 格 × N 行的轨道）不值得：
            轨道上真正要看的信息只有"哪些挤在一起"，而那从列表的到期日
            一列就能看出来，还不用横向滚动。

            命令行 `inventory timeline` **保留**（脚本要用结构化数据），
            所以 core/timeline.ts 与它那几个测试都还在。
            要恢复这一页：这个按钮加回来、`state.tab` 的联合类型里补上
            `'timeline'`、`render()` 的 switch 里补一个分支、
            再把 `timeline:data` 这条 IPC（preload + main）加回来。
          -->
          <!--
            「工作区」不再是常驻页签。它是"换个地方"这种低频动作，
            占着一个页签的位置不值得；入口改成工作区下拉框左边那个返回箭头。
            「字段与格式」同理隐藏 —— 那一页展示的是 manifest 与字段定义，
            属于内部实现，日常用不到。
            两页的代码都保留：`schema show` 与排查问题时还要用。
          -->
          <button data-tab="workspaces" class="tab hidden">工作区</button>
          <button data-tab="schema" class="tab hidden">字段与格式</button>
        </nav>
      </header>

      <!-- 常驻横幅：打开就能看到，这是整个应用存在的主要理由 -->
      <div id="banner" class="hidden">
        <div id="banner-text"></div>
        <div id="banner-chips"></div>
      </div>

      <main id="view"></main>
    </div>

    <div id="modal-root" class="hidden"></div>
    <div id="toast-root"></div>

    <script src="app.js"></script>
  </body>
</html>
